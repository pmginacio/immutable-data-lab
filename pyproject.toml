[project]
name = "immutable-data-lab"
version = "0.1.0"
description = "Small experiments on immutable data, functional style in Python, and storage without SQL everywhere."
readme = "README.md"
authors = [
    { name = "Pedro Inacio", email = "pedro@viaduct.ai" }
]
requires-python = ">=3.15"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
]

[tool.uv.build-backend]
module-name = "inlay"

[tool.pyright]
include = ["src", "tests/check_types.py", "examples"]
reportUnnecessaryTypeIgnoreComment = true
